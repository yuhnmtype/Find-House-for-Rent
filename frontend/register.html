<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up · Find House for Rent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="fh-auth">
    <div class="fh-auth__art">
      <a href="index.html" class="fh-brand" style="position:relative;z-index:2">
        <span class="fh-brand__mark" style="background:var(--terra)">FH</span>
        <span class="fh-brand__text" style="color:var(--paper)">Find House <em>HCMC</em></span>
      </a>
      <div style="position:relative;z-index:2">
        <h2 style="color:var(--paper);font-size:2.4rem;line-height:1.1">
          Join the<br>community.</h2>
        <p style="color:rgba(251,247,240,.8);max-width:24rem">
          Students find their next home. Landlords reach thousands of
          students near campus. It's free to start.</p>
      </div>
      <p style="position:relative;z-index:2;color:rgba(251,247,240,.6);font-size:.85rem">
        Web Application Development · Final Project</p>
    </div>

    <div class="fh-auth__form">
      <div class="fh-auth__form-inner">
        <a href="index.html" class="btn btn-ghost btn-sm mb-4 d-lg-none">
          <i class="bi bi-arrow-left"></i> Home</a>
        <p class="fh-section-eyebrow mb-1">Account</p>
        <h1 class="h3 mb-4">Create your account</h1>

        <div class="mb-3">
          <label class="form-label">I am a…</label>
          <div class="d-flex gap-2">
            <input type="radio" class="btn-check" name="role" id="role-student" value="STUDENT" checked>
            <label class="btn btn-fh-outline flex-fill" for="role-student">
              <i class="bi bi-mortarboard"></i> Student</label>
            <input type="radio" class="btn-check" name="role" id="role-landlord" value="LANDLORD">
            <label class="btn btn-fh-outline flex-fill" for="role-landlord">
              <i class="bi bi-house-door"></i> Landlord</label>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="fullName">Full name</label>
          <input id="fullName" class="form-control" placeholder="Nguyen Van A">
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input id="email" type="email" class="form-control" placeholder="you@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label" for="phone">Phone (optional)</label>
          <input id="phone" class="form-control" placeholder="09xxxxxxxx">
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input id="password" type="password" class="form-control" placeholder="At least 6 characters">
        </div>
        <button id="submit" class="btn btn-fh w-100 mt-2">Create account</button>

        <p class="text-center text-soft mt-4 mb-0">
          Already have an account? <a href="login.html">Log in</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pages/register.js"></script>
</body>
</html>
