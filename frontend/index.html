<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find House for Rent – Student Housing in Ho Chi Minh City</title>
  <meta name="description" content="Find rooms, apartments and houses for rent near universities in Ho Chi Minh City. Connecting students with trusted landlords.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="app-navbar"></div>

  <main>
    <!-- Hero -->
    <section class="fh-hero">
      <div class="container">
        <div class="row">
          <div class="col-lg-8">
            <p class="fh-hero__eyebrow">Student housing · Ho Chi Minh City</p>
            <h1>Find a place that feels<br>like <em>home</em>, near campus.</h1>
            <p class="fh-hero__lead mt-3">
              Browse verified rooms, apartments and houses posted by trusted
              landlords. Filter by district, budget and amenities — then book
              a visit in a few clicks.
            </p>
          </div>
        </div>
      </div>
    </section>

    <div class="container">
      <!-- Search panel -->
      <div class="fh-searchbar">
        <div class="row g-2 align-items-end">
          <div class="col-12 col-md-4 col-lg-3">
            <label class="form-label" for="f-keyword">Keyword</label>
            <input id="f-keyword" class="form-control" placeholder="Title, area, address…">
          </div>
          <div class="col-6 col-md-4 col-lg-2">
            <label class="form-label" for="f-district">District</label>
            <select id="f-district" class="form-select"><option value="">Any</option></select>
          </div>
          <div class="col-6 col-md-4 col-lg-2">
            <label class="form-label" for="f-type">Type</label>
            <select id="f-type" class="form-select"><option value="">Any</option></select>
          </div>
          <div class="col-6 col-lg-2">
            <label class="form-label" for="f-max">Max price (₫)</label>
            <input id="f-max" type="number" min="0" step="100000" class="form-control" placeholder="e.g. 4000000">
          </div>
          <div class="col-6 col-lg-2">
            <label class="form-label" for="f-interior">Interior</label>
            <select id="f-interior" class="form-select"><option value="">Any</option></select>
          </div>
          <div class="col-12 col-lg-1 d-grid">
            <button id="f-search" class="btn btn-fh">Search</button>
          </div>
        </div>
      </div>

      <!-- Results -->
      <section class="my-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <p class="fh-section-eyebrow mb-1">Available now</p>
            <h2 class="h3 mb-0">Listings</h2>
          </div>
          <div class="d-flex align-items-center gap-2">
            <span id="result-count" class="text-soft small"></span>
            <select id="f-sort" class="form-select form-select-sm" style="width:auto">
              <option value="createdAt|desc">Newest</option>
              <option value="price|asc">Price: low to high</option>
              <option value="price|desc">Price: high to low</option>
              <option value="area|desc">Largest area</option>
            </select>
          </div>
        </div>

        <div id="listings" class="row g-4"></div>

        <div id="pager" class="d-flex justify-content-center gap-2 mt-4"></div>
      </section>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pages/index.js"></script>
</body>
</html>
