<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landlord dashboard · Find House for Rent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="app-navbar"></div>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-4">
      <div>
        <p class="fh-section-eyebrow mb-1">Landlord</p>
        <h1 class="h2 mb-0">Hi, <span id="hello">there</span></h1>
      </div>
      <button class="btn btn-fh-accent" id="btn-new-listing">
        <i class="bi bi-plus-lg"></i> New listing</button>
    </div>

    <div id="stats" class="row g-3 mb-4"></div>

    <div class="fh-tabs">
      <button class="fh-tab is-active" data-tab="listings">My listings</button>
      <button class="fh-tab" data-tab="requests">Booking requests</button>
      <button class="fh-tab" data-tab="payments">Payments</button>
      <button class="fh-tab" data-tab="profile">Profile</button>
    </div>

    <section id="tab-listings" class="tab-panel"></section>
    <section id="tab-requests" class="tab-panel d-none"></section>
    <section id="tab-payments" class="tab-panel d-none"></section>
    <section id="tab-profile" class="tab-panel d-none"></section>
  </main>

  <!-- Listing create/edit modal -->
  <div class="modal fade" id="listingModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content" style="border-radius:var(--radius);border:none">
        <div class="modal-header">
          <h5 class="modal-title" id="listingModalTitle">New listing</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="listingForm"></div>
      </div>
    </div>
  </div>

  <!-- Contract modal -->
  <div class="modal fade" id="contractModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content" style="border-radius:var(--radius);border:none">
        <div class="modal-header">
          <h5 class="modal-title">Create rental contract</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="contractForm"></div>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pages/dashboard-common.js"></script>
  <script src="assets/js/pages/landlord-requests.js"></script>
  <script src="assets/js/pages/landlord.js"></script>
</body>
</html>
