<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff dashboard · Find House for Rent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="app-navbar"></div>

  <main class="container py-4">
    <div class="mb-4">
      <p class="fh-section-eyebrow mb-1">Staff · Administration</p>
      <h1 class="h2 mb-0">Platform overview</h1>
    </div>

    <div id="stats" class="row g-3 mb-4"></div>

    <div class="fh-tabs">
      <button class="fh-tab is-active" data-tab="users">Users</button>
      <button class="fh-tab" data-tab="houses">All listings</button>
      <button class="fh-tab" data-tab="bookings">All bookings</button>
      <button class="fh-tab" data-tab="payments">All payments</button>
    </div>

    <section id="tab-users" class="tab-panel"></section>
    <section id="tab-houses" class="tab-panel d-none"></section>
    <section id="tab-bookings" class="tab-panel d-none"></section>
    <section id="tab-payments" class="tab-panel d-none"></section>
  </main>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pages/dashboard-common.js"></script>
  <script src="assets/js/pages/staff.js"></script>
</body>
</html>
